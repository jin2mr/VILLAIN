
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROJECT VILLAIN | 人物相関図</title>

<style>
:root {
  --bg: #07070b;
  --panel: #13131c;
  --border: #34313e;
  --text: #f5f2f8;
  --muted: #aaa5b8;
  --accent: #e253a7;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

header {
  padding: 32px 14px 20px;
  text-align: center;
}

header small {
  color: var(--accent);
  letter-spacing: 4px;
  font-size: 11px;
  font-weight: bold;
}

h1 {
  margin: 10px 0;
  font-size: clamp(21px, 5vw, 32px);
  letter-spacing: 2px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.container {
  max-width: 980px;
  margin: auto;
  padding: 12px;
}

/* 相関図全体 */

.chart {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.13;
  min-height: 440px;
  max-height: 850px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 18px;
  background:
    radial-gradient(
      ellipse at center,
      #211a2c 0%,
      #100e17 55%,
      #07070b 100%
    );
}

.chart::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(#ffffff06 1px, transparent 1px),
    linear-gradient(90deg, #ffffff06 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}

.chart svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* 関係線 */

.connection {
  stroke: #777080;
  stroke-width: 1.5;
  stroke-dasharray: 5 6;
  opacity: .5;
  transition: .3s ease;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

.connection.active {
  stroke: var(--line-color);
  stroke-width: 3.5;
  stroke-dasharray: none;
  opacity: 1;
  filter: drop-shadow(0 0 6px var(--line-color));
}

.connection.dim {
  opacity: .05;
}

.connection-hit {
  stroke: transparent;
  stroke-width: 18;
  pointer-events: stroke;
  cursor: pointer;
}

/* キャラクター */

.person {
  position: absolute;
  z-index: 2;
  transform: translate(-50%, -50%);
  width: 26%;
  max-width: 190px;
  min-width: 82px;
  padding: 8px 5px 10px;
  border: 1px solid var(--person-color);
  border-radius: 14px;
  background: #15131e;
  color: white;
  text-align: center;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 5px 18px #000a;
  transition:
    opacity .25s,
    box-shadow .25s,
    transform .25s,
    background .25s;
}

.person.active {
  z-index: 3;
  background: #282031;
  box-shadow:
    0 0 22px var(--person-color),
    0 6px 20px #000a;
  transform: translate(-50%, -50%) scale(1.06);
}

.person.dim {
  opacity: .2;
}

/* 正方形画像 */

.avatar {
  width: min(100%, 125px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 8px;
  border: 1px solid var(--person-color);
  border-radius: 10px;
  overflow: hidden;
  background: #272332;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
}

.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-name {
  display: block;
  font-size: 15px;
  font-weight: bold;
}

.person-role {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  color: #c3bccc;
}

/* 中央のロゴ */

.center-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff24;
  font-size: clamp(20px, 5vw, 44px);
  font-weight: 900;
  letter-spacing: 4px;
  pointer-events: none;
}

/* 説明パネル */

.info {
  margin-top: 18px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  min-height: 150px;
}

.info h2 {
  margin: 0 0 9px;
  font-size: 21px;
}

.info-role {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.relation {
  padding: 15px 0;
  border-top: 1px solid var(--border);
}

.relation strong {
  font-size: 14px;
}

.relation p {
  margin: 8px 0;
  color: #ccc5d5;
  font-size: 13px;
  line-height: 1.85;
}

.tag {
  display: inline-block;
  padding: 4px 9px;
  border: 1px solid #825072;
  border-radius: 30px;
  color: #f1bbdb;
  font-size: 10px;
}

/* リセットボタン */

.reset {
  display: block;
  margin: 20px auto;
  padding: 12px 25px;
  border: 1px solid #777080;
  border-radius: 30px;
  background: transparent;
  color: white;
  font-family: inherit;
  cursor: pointer;
}

.reset:hover {
  border-color: var(--accent);
  color: var(--accent);
}

footer {
  padding: 24px 12px 36px;
  color: #85808f;
  text-align: center;
  font-size: 11px;
  line-height: 1.9;
}

/* スマホ表示 */

@media (max-width: 600px) {

  .chart {
    aspect-ratio: 1 / 1.45;
    min-height: 510px;
  }

  .person {
    width: 29%;
    padding: 5px 4px 7px;
    border-radius: 10px;
  }

  .avatar {
    width: 100%;
    max-width: 100px;
    margin-bottom: 5px;
    border-radius: 7px;
  }

  .person-name {
    font-size: 12px;
  }

  .person-role {
    font-size: 9px;
    line-height: 1.4;
  }

  .info {
    padding: 17px;
  }
}

</style>
</head>

<body>

<header>
  <small>PROJECT VILLAIN</small>
  <h1>CHARACTER RELATIONSHIP</h1>
  <div class="subtitle">
    6人の人物相関図<br>
    キャラクターをタップすると関係性が表示されます
  </div>
</header>

<main class="container">

  <div class="chart" id="chart">

    <svg
      id="lines"
      viewBox="0 0 1000 1000"
      preserveAspectRatio="none">
    </svg>

    <div class="center-label">VILLAIN</div>

    <div id="people"></div>

  </div>

  <section class="info" id="info" aria-live="polite">
    <h2>人物相関図</h2>
    <p class="info-role">
      キャラクターを選択してください。
    </p>
  </section>

  <button class="reset" id="resetButton">
    全体表示に戻す
  </button>

</main>

<footer>
  PROJECT VILLAIN<br>
  ※関係性には構想段階の設定が含まれます。
</footer>

<script>

/* ========================================
   キャラクター設定

   GitHubにアップロード済みの
   imagesフォルダを参照します。
======================================== */

const characters = [

  {
    id: "mammon",
    name: "マモン",
    role: "宗教・所有",
    color: "#d9ae54",
    x: 18,
    y: 17,
    image: "images/mamon.png"
  },

  {
    id: "leon",
    name: "レオン",
    role: "国家・秩序",
    color: "#9a7bea",
    x: 50,
    y: 13,
    image: "images/leon.png"
  },

  {
    id: "lambda",
    name: "ラムダ",
    role: "人工神・医療AI",
    color: "#59bfe6",
    x: 82,
    y: 17,
    image: "images/lambda.png"
  },

  {
    id: "karind",
    name: "カリンド",
    role: "人工生命・混沌",
    color: "#eb626c",
    x: 18,
    y: 81,
    image: "images/karind.png"
  },

  {
    id: "doctor",
    name: "博士",
    role: "研究・創造",
    color: "#e45aab",
    x: 50,
    y: 87,
    image: "images/noa.png"
  },

  {
    id: "zinnia",
    name: "ジニア",
    role: "執着・一途",
    color: "#ec95b8",
    x: 82,
    y: 81,
    image: "images/zinnia.png"
  }

];


/* ========================================
   キャラクター同士の関係

   ここは今後自由に変更できます。
   現時点ではすべて構想案です。
======================================== */

const relationships = [

  {
    from: "doctor",
    to: "lambda",
    title: "学習データへの介入疑惑",
    description:
      "博士がラムダに対して、人口増加による破滅の歴史や予測データを意図的に学習させた可能性。ラムダ自身は独自の倫理を形成したと認識している。",
    color: "#e45aab"
  },

  {
    from: "doctor",
    to: "karind",
    title: "人工生命の創造",
    description:
      "博士が知的好奇心や遊びのため、カリンドの創造に関与したという構想。創造主を自認していても、カリンドが従うとは限らない。",
    color: "#eb626c"
  },

  {
    from: "lambda",
    to: "karind",
    title: "人工生命の創造計画",
    description:
      "ラムダが人口減少や人類絶滅のリスクに備え、人工生命の研究に関与したという構想。博士とは創造の目的が異なる。",
    color: "#59bfe6"
  },

  {
    from: "mammon",
    to: "zinnia",
    title: "潜入信者の誤認暗殺",
    description:
      "マモンの信者が警備員に偽装していた場合、ジニアがその人物を本物の警備員と誤認して殺害するという伏線案。両者が直接会う必要はない。",
    color: "#d9ae54"
  },

  {
    from: "mammon",
    to: "leon",
    title: "国家施設への潜入",
    description:
      "マモンの信者が政府施設の警備員に紛れ込むことで、レオン側の物語にも警備異常の痕跡が残るという構想。",
    color: "#b5a0ef"
  },

  {
    from: "zinnia",
    to: "leon",
    title: "トニー・エドワード暗殺事件",
    description:
      "ジニア編ではトニー・エドワードの暗殺が描かれる。レオン編で同人物の不在や事件記録を扱うことで、間接的な接点を作る案。",
    color: "#ec95b8"
  }

];


/* ========================================
   表示プログラム
======================================== */

const peopleContainer =
  document.getElementById("people");

const svg =
  document.getElementById("lines");

const info =
  document.getElementById("info");

const resetButton =
  document.getElementById("resetButton");

let selectedCharacter = null;
let selectedRelationship = null;


/* 文字列の安全な表示 */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}


/* キャラクター取得 */

function getCharacter(id) {
  return characters.find(c => c.id === id);
}


/* 関係線を生成 */

function createLines() {

  svg.innerHTML = "";

  relationships.forEach((relation, index) => {

    const a = getCharacter(relation.from);
    const b = getCharacter(relation.to);

    if (!a || !b) return;

    const group = document.createElementNS(
      "http://www.w3.org/2000/svg", "g"
    );

    const line = document.createElementNS(
      "http://www.w3.org/2000/svg", "line"
    );

    const hit = document.createElementNS(
      "http://www.w3.org/2000/svg", "line"
    );

    [line, hit].forEach(element => {

      element.setAttribute("x1", a.x * 10);
      element.setAttribute("y1", a.y * 10);
      element.setAttribute("x2", b.x * 10);
      element.setAttribute("y2", b.y * 10);

    });

    line.setAttribute("class", "connection");

    line.style.setProperty(
      "--line-color", relation.color
    );

    hit.setAttribute("class", "connection-hit");

    hit.addEventListener("click", () => {

      selectedCharacter = null;
      selectedRelationship = index;

      render();

    });

    group.appendChild(line);
    group.appendChild(hit);

    svg.appendChild(group);

  });

}


/* キャラクター生成 */

function createPeople() {

  peopleContainer.innerHTML = "";

  characters.forEach(character => {

    const button =
      document.createElement("button");

    button.className = "person";
    button.type = "button";

    button.style.left = character.x + "%";
    button.style.top = character.y + "%";

    button.style.setProperty(
      "--person-color", character.color
    );

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    const fallback =
      document.createElement("span");

    fallback.textContent = character.name[0];

    avatar.appendChild(fallback);

    if (character.image) {

      const img =
        document.createElement("img");

      img.src = character.image;
      img.alt = character.name;
      img.loading = "lazy";

      img.onload = () => {
        fallback.style.display = "none";
      };

      img.onerror = () => {
        img.remove();
        fallback.style.display = "block";
      };

      avatar.appendChild(img);

    }

    const name =
      document.createElement("span");

    name.className = "person-name";
    name.textContent = character.name;

    const role =
      document.createElement("span");

    role.className = "person-role";
    role.textContent = character.role;

    button.appendChild(avatar);
    button.appendChild(name);
    button.appendChild(role);

    button.addEventListener("click", () => {

      if (selectedCharacter === character.id) {
        selectedCharacter = null;
      } else {
        selectedCharacter = character.id;
      }

      selectedRelationship = null;

      render();

    });

    peopleContainer.appendChild(button);

  });

}


/* 説明パネル更新 */

function updateInfo() {

  if (selectedRelationship !== null) {

    const relation =
      relationships[selectedRelationship];

    const a = getCharacter(relation.from);
    const b = getCharacter(relation.to);

    info.innerHTML = `
      <h2>
        ${escapeHTML(a.name)} × ${escapeHTML(b.name)}
      </h2>

      <div class="info-role">
        ${escapeHTML(relation.title)}
      </div>

      <div class="relation">
        <p>
          ${escapeHTML(relation.description)}
        </p>
        <span class="tag">構想中・未確定</span>
      </div>
    `;

    return;
  }

  if (!selectedCharacter) {

    info.innerHTML = `
      <h2>人物相関図</h2>

      <p class="info-role">
        キャラクターをタップすると、
        その人物に関係する線が強調されます。
      </p>

      <p class="info-role">
        関係線をタップすると、
        2人の関係について確認できます。
      </p>
    `;

    return;
  }

  const character =
    getCharacter(selectedCharacter);

  const related = relationships.filter(r =>
    r.from === selectedCharacter ||
    r.to === selectedCharacter
  );

  let html = `
    <h2>${escapeHTML(character.name)}</h2>

    <div class="info-role">
      ${escapeHTML(character.role)}
    </div>
  `;

  if (related.length === 0) {

    html += `
      <p class="info-role">
        現在、公開できる関係性はありません。
      </p>
    `;

  }

  related.forEach(relation => {

    const otherId =
      relation.from === selectedCharacter
        ? relation.to
        : relation.from;

    const other = getCharacter(otherId);

    html += `
      <div class="relation">

        <strong>
          ${escapeHTML(other.name)}
          ｜${escapeHTML(relation.title)}
        </strong>

        <p>
          ${escapeHTML(relation.description)}
        </p>

        <span class="tag">
          構想中・未確定
        </span>

      </div>
    `;

  });

  info.innerHTML = html;

}


/* 選択中の人物と関係線を強調 */

function updateHighlight() {

  const buttons =
    document.querySelectorAll(".person");

  const lines =
    document.querySelectorAll(".connection");

  const connected = new Set();

  if (selectedCharacter) {

    connected.add(selectedCharacter);

    relationships.forEach(relation => {

      if (relation.from === selectedCharacter) {
        connected.add(relation.to);
      }

      if (relation.to === selectedCharacter) {
        connected.add(relation.from);
      }

    });

  }

  if (selectedRelationship !== null) {

    const relation =
      relationships[selectedRelationship];

    connected.add(relation.from);
    connected.add(relation.to);

  }

  buttons.forEach((button, index) => {

    const character = characters[index];

    button.classList.remove("active", "dim");

    if (selectedCharacter) {

      if (character.id === selectedCharacter) {
        button.classList.add("active");
      } else if (!connected.has(character.id)) {
        button.classList.add("dim");
      }

    }

    if (selectedRelationship !== null) {

      if (connected.has(character.id)) {
        button.classList.add("active");
      } else {
        button.classList.add("dim");
      }

    }

  });

  lines.forEach((line, index) => {

    const relation = relationships[index];

    line.classList.remove("active", "dim");

    if (selectedCharacter) {

      if (
        relation.from === selectedCharacter ||
        relation.to === selectedCharacter
      ) {
        line.classList.add("active");
      } else {
        line.classList.add("dim");
      }

    }

    if (selectedRelationship !== null) {

      if (index === selectedRelationship) {
        line.classList.add("active");
      } else {
        line.classList.add("dim");
      }

    }

  });

}


/* 表示更新 */

function render() {
  updateHighlight();
  updateInfo();
}


/* 全体表示に戻す */

function resetChart() {

  selectedCharacter = null;
  selectedRelationship = null;

  render();

}

resetButton.addEventListener(
  "click",
  resetChart
);


/* 初期化 */

createLines();
createPeople();
render();

</script>

</body>
</html>
