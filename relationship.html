
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09070e">
  <title>PROJECT VILLAIN | 人物相関図</title>

  <style>
    :root {
      --bg: #09070e;
      --text: #f5f0f7;
      --muted: #b4a8ba;
      --border: #514054;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          ellipse at 50% 5%,
          #261329 0%,
          transparent 40%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 42px 16px 70px;
    }

    /* ヘッダー */

    .site-header {
      text-align: center;
      margin-bottom: 38px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #bba3c2;
      font-size: 11px;
      letter-spacing: 0.3em;
    }

    .site-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 7vw, 48px);
      letter-spacing: 0.09em;
      line-height: 1.3;
    }

    .site-subtitle {
      margin: 22px 0 0;
      color: #b8aabd;
      font-size: clamp(12px, 3.2vw, 16px);
      line-height: 1.8;
    }

    /* 相関図全体 */

    .relationship-board {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 0.73;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: #0b0810;
      box-shadow:
        0 20px 65px #0009,
        inset 0 0 40px #0008;
    }

    /*
      背景画像を枠全体に敷く。
      cover により枠いっぱいに拡大。
      画像の比率によっては上下または左右が
      一部トリミングされます。
    */

    .board-background {
      position: absolute;
      z-index: -3;
      inset: 0;
      background-image:
        url("images/relationship-bg.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0.78;
      pointer-events: none;
    }

    /* 背景を少し暗くして人物を見やすくする */

    .board-shade {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(6, 4, 11, 0.38) 0%,
          rgba(6, 4, 11, 0.18) 28%,
          rgba(6, 4, 11, 0.12) 50%,
          rgba(6, 4, 11, 0.2) 72%,
          rgba(6, 4, 11, 0.48) 100%
        );
      pointer-events: none;
    }

    /* 関係線 */

    .connection-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .connection {
      fill: none;
      stroke: var(--line-color, #d6b1e3);
      stroke-width: 0.34;
      stroke-linecap: round;
      opacity: 0;
      filter: drop-shadow(
        0 0 1.5px var(--line-color, #d6b1e3)
      );
      transition: opacity 0.2s ease;
    }

    .connection.active {
      opacity: 0.88;
    }

    .connection.draw {
      animation: drawLine 0.72s ease-out forwards;
    }

    @keyframes drawLine {
      from {
        stroke-dashoffset: var(--line-length);
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    /* 人物配置 */

    .characters {
      position: absolute;
      z-index: 2;
      inset: 0;
    }

    .character {
      --accent: #bc94d5;

      position: absolute;
      width: 29.5%;
      padding: 5px 5px 12px;
      border: 1px solid var(--accent);
      border-radius: 17px;
      background: rgba(17, 12, 23, 0.92);
      color: white;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 18px #0009;
      transition:
        opacity 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.35s ease,
        background 0.3s ease;
    }

    .character:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    .character img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid var(--accent);
      border-radius: 11px;
    }

    .character-name {
      display: block;
      margin-top: 10px;
      font-size: clamp(13px, 3.4vw, 23px);
      font-weight: 800;
      line-height: 1.3;
    }

    .character-role {
      display: block;
      margin-top: 5px;
      color: #c7bccc;
      font-size: clamp(9px, 2.35vw, 14px);
      line-height: 1.5;
    }

    /* タップ後、関係のない人物を少し暗く */

    .character.dimmed {
      opacity: 0.43;
    }

    /* 関係のある人物の常時発光 */

    .character.connected,
    .character.selected {
      background: rgba(26, 17, 32, 0.97);
      box-shadow:
        0 0 10px color-mix(
          in srgb,
          var(--accent) 35%,
          transparent
        ),
        0 0 20px color-mix(
          in srgb,
          var(--accent) 15%,
          transparent
        );
    }

    .character.selected {
      border-width: 2px;
    }

    /*
      線が到達した瞬間だけ明るく発光。
      アニメーション終了後は
      connected の控えめな発光に戻る。
    */

    .character.flash {
      animation: borderFlash 0.75s ease-out;
    }

    @keyframes borderFlash {
      0% {
        box-shadow:
          0 0 7px var(--accent);
      }

      30% {
        box-shadow:
          0 0 15px var(--accent),
          0 0 32px var(--accent),
          0 0 48px color-mix(
            in srgb,
            var(--accent) 60%,
            transparent
          );
      }

      100% {
        box-shadow:
          0 0 10px color-mix(
            in srgb,
            var(--accent) 35%,
            transparent
          ),
          0 0 20px color-mix(
            in srgb,
            var(--accent) 15%,
            transparent
          );
      }
    }

    /* 上段 */

    #mamon {
      left: 18%;
      top: 18%;
      --accent: #d8aa63;
    }

    #leon {
      left: 50%;
      top: 18%;
      --accent: #ae83e8;
    }

    #lambda {
      left: 82%;
      top: 18%;
      --accent: #76c9df;
    }

    /* 下段 */

    #karind {
      left: 18%;
      top: 82%;
      --accent: #e2778d;
    }

    #noa {
      left: 50%;
      top: 82%;
      --accent: #ed8cc7;
    }

    #zinnia {
      left: 82%;
      top: 82%;
      --accent: #e7a0bb;
    }

    /* 操作ヒント */

    .board-hint {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 1.3%;
      text-align: center;
      font-size: clamp(8px, 1.9vw, 12px);
      letter-spacing: 0.13em;
      color: #b7a8bb;
      pointer-events: none;
      text-shadow: 0 1px 5px black;
    }

    /* 詳細パネル */

    .dossier {
      margin-top: 36px;
      padding: 25px 23px 30px;
      border: 1px solid #4c3852;
      border-radius: 27px;
      background:
        linear-gradient(
          150deg,
          #211425,
          #120e19 58%,
          #0e0b13
        );
      box-shadow: 0 15px 40px #0005;
    }

    .dossier-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dossier-code {
      color: #bfa8c7;
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .confidential {
      border: 1px solid #745b79;
      padding: 9px 12px;
      color: #c6b2cf;
      font-size: 10px;
    }

    .dossier h2 {
      margin: 0 0 15px;
      font-size: clamp(23px, 6vw, 34px);
    }

    .dossier-intro {
      margin: 0;
      color: #cbbdce;
      font-size: 14px;
      line-height: 1.9;
    }

    .relation-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .relation-item {
      padding: 16px;
      border: 1px solid #49364e;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .relation-item h3 {
      margin: 0 0 9px;
      font-size: 16px;
      color: #f3d5f5;
    }

    .relation-item p {
      margin: 0;
      color: #cbbfd0;
      font-size: 13px;
      line-height: 1.85;
    }

    .relation-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      border: 1px solid #6b4e72;
      border-radius: 5px;
      color: #d6afd9;
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    .reset-button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 1px solid #795a7e;
      border-radius: 10px;
      background: transparent;
      color: #e6d5ea;
      cursor: pointer;
    }

    .reset-button:hover {
      background: #38223c;
    }

    .footer {
      margin-top: 35px;
      color: #8c7c93;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-align: center;
    }

    @media (min-width: 700px) {
      .relationship-board {
        aspect-ratio: 1.15;
      }

      .character {
        width: 25%;
        padding: 8px 8px 15px;
      }

      #mamon, #leon, #lambda {
        top: 23%;
      }

      #karind, #noa, #zinnia {
        top: 77%;
      }

      .dossier {
        padding: 35px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .connection.draw,
      .character.flash {
        animation-duration: 0.01ms;
      }

      .character,
      .connection {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

  <script>
    "use strict";

    /*

      ====================================
    */

    const characters = {

    /*

    */

    const relationships = [

      {

        description:

      {

        description:

      {

      },

      },

        status: "接点検討中",
        description:
          "ジニアによる警備員の殺害が、" +
          "施設の警備記録や捜査に" +
          "痕跡を残す可能性。" +
          "直接対面する必要はない。"
      },

      {
        a: "leon",
        b: "lambda",
        label: "国家と高度AI",
        status: "接点検討中",
        description:

          "高度AIの判断が交差する可能性。" +
          "具体的な関係は今後の設定次第。"
      }

    ];

    /*
      ====================================
      表示制御
      ====================================
    */

    const board = document.getElementById(
      "relationshipBoard"
    );

    const layer = document.getElementById(
      "connectionLayer"
    );

    const buttons = [
      ...document.querySelectorAll(
        ".character"
      )
    ];

    const dossierCode = document.getElementById(
      "dossierCode"
    );

    const dossierTitle = document.getElementById(
      "dossierTitle"
    );

    const dossierIntro = document.getElementById(
      "dossierIntro"
    );

    const relationList = document.getElementById(
      "relationList"
    );

    const resetButton = document.getElementById(
      "resetButton"
    );

    let selectedId = null;
    let animationTimers = [];
    let currentLines = [];

    const SVG_NS =
      "http://www.w3.org/2000/svg";

    /*
      タイマーをまとめて解除
    */

    function clearTimers() {
      animationTimers.forEach(clearTimeout);
      animationTimers = [];
    }

    /*
      タイマー登録
    */

    function schedule(callback, delay) {
      const timer = setTimeout(callback, delay);
      animationTimers.push(timer);
    }

    /*
      人物カードの中心座標を取得

      SVGは viewBox 0 0 100 100 なので
      座標をパーセントへ変換する。
    */

    function getPosition(id) {
      const element = document.getElementById(id);

      const boardRect =
        board.getBoundingClientRect();

      const rect =
        element.getBoundingClientRect();

      return {
        x:
          (
            rect.left +
            rect.width / 2 -
            boardRect.left
          ) / boardRect.width * 100,

        y:
          (
            rect.top +
            rect.height / 2 -
            boardRect.top
          ) / boardRect.height * 100
      };
    }

    /*
      カードの外周付近で線を止める

      カードの中央から線を伸ばすと
      画像の下を線が通ってしまうため、
      枠の手前で終わるよう調整する。
    */

    function getEdgePoints(a, b) {
      const start = getPosition(a);
      const end = getPosition(b);

      const dx = end.x - start.x;
      const dy = end.y - start.y;

      const distance = Math.hypot(dx, dy);

      if (!distance) {
        return {
          x1: start.x,
          y1: start.y,
          x2: end.x,
          y2: end.y
        };
      }

      const ux = dx / distance;
      const uy = dy / distance;

      const boardRect =
        board.getBoundingClientRect();

      const startRect =
        document.getElementById(a)
          .getBoundingClientRect();

      const endRect =
        document.getElementById(b)
          .getBoundingClientRect();

      /*
        矩形の外周までの距離を
        線の方向から計算する。
      */

      function edgeDistance(rect, vx, vy) {
        const halfWidth =
          rect.width / boardRect.width * 50;

        const halfHeight =
          rect.height / boardRect.height * 50;

        const tx =
          Math.abs(vx) > 0.0001
            ? halfWidth / Math.abs(vx)
            : Infinity;

        const ty =
          Math.abs(vy) > 0.0001
            ? halfHeight / Math.abs(vy)
            : Infinity;

        return Math.min(tx, ty);
      }

      const startOffset =
        edgeDistance(startRect, ux, uy) + 0.4;

      const endOffset =
        edgeDistance(endRect, ux, uy) + 0.4;

      return {
        x1: start.x + ux * startOffset,
        y1: start.y + uy * startOffset,
        x2: end.x - ux * endOffset,
        y2: end.y - uy * endOffset
      };
    }

    /*
      関係線を作成
    */

    function createConnection(from, to, index) {
      const points = getEdgePoints(from, to);

      const line = document.createElementNS(
        SVG_NS,
        "line"
      );

      line.setAttribute("x1", points.x1);
      line.setAttribute("y1", points.y1);
      line.setAttribute("x2", points.x2);
      line.setAttribute("y2", points.y2);

      line.classList.add("connection");

      const sourceColor = getComputedStyle(
        document.getElementById(from)
      ).getPropertyValue("--accent").trim();

      line.style.setProperty(
        "--line-color",
        sourceColor || "#d6b1e3"
      );

      const length = Math.hypot(
        points.x2 - points.x1,
        points.y2 - points.y1
      );

      line.style.strokeDasharray = length;
      line.style.strokeDashoffset = length;

      line.style.setProperty(
        "--line-length",
        String(length)
      );

      layer.appendChild(line);

      const delay = index * 130;

      /*
        少しずつ順番に線が伸びる
      */

      schedule(() => {
        line.classList.add("active");

        // アニメーションを確実に開始
        void line.getBoundingClientRect();

        line.classList.add("draw");
      }, delay);

      /*
        線が到達したタイミングで
        接続先のカードが一瞬光る
      */

      schedule(() => {
        const target =
          document.getElementById(to);

        target.classList.add("connected");

        target.classList.remove("flash");

        void target.offsetWidth;

        target.classList.add("flash");
      }, delay + 690);

      currentLines.push({
        element: line,
        from,
        to
      });
    }

    /*
      表示中の線を消去
    */

    function removeConnections() {
      layer.replaceChildren();
      currentLines = [];
    }

    /*
      人物の見た目を初期化
    */

    function resetCardStyles() {
      buttons.forEach(button => {
        button.classList.remove(
          "selected",
          "connected",
          "dimmed",
          "flash"
        );

        button.setAttribute(
          "aria-pressed",
          "false"
        );
      });
    }

    /*
      詳細テキストを安全に作成
    */

    function addRelationItem(
      otherName,
      relation
    ) {
      const item = document.createElement(
        "article"
      );

      item.className = "relation-item";

      const tag = document.createElement(
        "span"
      );

      tag.className = "relation-tag";
      tag.textContent = relation.status;

      const title = document.createElement(
        "h3"
      );

      title.textContent =
        otherName + " ｜ " + relation.label;

      const description =
        document.createElement("p");

      description.textContent =
        relation.description;

      item.append(
        tag,
        title,
        description
      );

      relationList.appendChild(item);
    }

    /*
      人物選択
    */

    function selectCharacter(id) {
      if (selectedId === id) {
        resetAll();
        return;
      }

      clearTimers();
      removeConnections();
      resetCardStyles();

      selectedId = id;

      const selectedButton =
        document.getElementById(id);

      const related = relationships.filter(
        relation =>
          relation.a === id ||
          relation.b === id
      );

      const relatedIds = new Set(
        related.map(relation =>
          relation.a === id
            ? relation.b
            : relation.a
        )
      );

      buttons.forEach(button => {
        const buttonId = button.dataset.id;

        if (buttonId === id) {
          button.classList.add("selected");
          button.setAttribute(
            "aria-pressed",
            "true"
          );
        } else if (!relatedIds.has(buttonId)) {
          button.classList.add("dimmed");
        }
      });

      /*
        関係線を描画
      */

      related.forEach((relation, index) => {
        const otherId =
          relation.a === id
            ? relation.b
            : relation.a;

        createConnection(
          id,
          otherId,
          index
        );
      });

      /*
        詳細パネル
      */

      dossierCode.textContent =
        "PERSONNEL DOSSIER / " +
        id.toUpperCase();

      dossierTitle.textContent =
        characters[id].name;

      dossierIntro.textContent =
        characters[id].summary;

      relationList.replaceChildren();

      if (related.length === 0) {
        const item =
          document.createElement("p");

        item.className = "dossier-intro";

        item.textContent =
          "現在、公開できる関係情報はありません。";

        relationList.appendChild(item);
      } else {
        related.forEach(relation => {
          const otherId =
            relation.a === id
              ? relation.b
              : relation.a;

          addRelationItem(
            characters[otherId].name,
            relation
          );
        });
      }

      resetButton.hidden = false;
    }

    /*
      全体表示へ戻す
    */

    function resetAll() {
      clearTimers();
      removeConnections();
      resetCardStyles();

      selectedId = null;

      dossierCode.textContent =
        "PERSONNEL DOSSIER / ALL";

      dossierTitle.textContent =
        "人物相関図";

      dossierIntro.textContent =
        "キャラクターをタップすると、" +
        "関係のある人物へ線が伸び、" +
        "関係性の説明が表示されます。";

      relationList.replaceChildren();

      resetButton.hidden = true;
    }

    /*
      画面サイズ変更時、
      関係線の座標を再計算する。

      アニメーションを再生せず、
      すでに接続済みの線として描画。
    */

    function redrawConnections() {
      if (!selectedId) return;

      clearTimers();
      removeConnections();

      const related = relationships.filter(
        relation =>
          relation.a === selectedId ||
          relation.b === selectedId
      );

      related.forEach(relation => {
        const otherId =
          relation.a === selectedId
            ? relation.b
            : relation.a;

        const points = getEdgePoints(
          selectedId,
          otherId
        );

        const line = document.createElementNS(
          SVG_NS,
          "line"
        );

        line.setAttribute("x1", points.x1);
        line.setAttribute("y1", points.y1);
        line.setAttribute("x2", points.x2);
        line.setAttribute("y2", points.y2);

        line.classList.add(
          "connection",
          "active"
        );

        const color = getComputedStyle(
          document.getElementById(selectedId)
        ).getPropertyValue("--accent").trim();

        line.style.setProperty(
          "--line-color",
          color || "#d6b1e3"
        );

        layer.appendChild(line);

        currentLines.push({
          element: line,
          from: selectedId,
          to: otherId
        });

        document
          .getElementById(otherId)
          .classList.add("connected");
      });
    }

    /*
      イベント設定
    */

    buttons.forEach(button => {
      button.setAttribute(
        "aria-pressed",
        "false"
      );

      button.addEventListener(
        "click",
        () => {
          selectCharacter(button.dataset.id);
        }
      );
    });

    resetButton.addEventListener(
      "click",
      resetAll
    );

    let resizeFrame = null;

    window.addEventListener(
      "resize",
      () => {
        cancelAnimationFrame(resizeFrame);

        resizeFrame = requestAnimationFrame(
          redrawConnections
        );
      }
    );

    /*
      初期化
    */

    resetAll();

  </script>

</body>
</html>
