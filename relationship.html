<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<title>PROJECT VILLAIN | 人物相関図</title>

<style>
:root {
  --bg: #08060d;
  --panel: #17101e;
  --text: #f5edf6;
  --muted: #b7a8bd;
  --border: rgba(208,166,217,.28);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(
      ellipse at 50% 0%,
      #26132c 0%,
      #08060d 48%
    );
  color: var(--text);
  font-family:
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  overflow-x: hidden;
}

button {
  font: inherit;
}

.page {
  width: min(100%, 980px);
  margin: auto;
  padding: 42px 14px 90px;
}

/* HEADER */

header {
  text-align: center;
  margin-bottom: 44px;
}

.archive {
  font-size: 11px;
  letter-spacing: .32em;
  color: #b4a0bd;
  margin-bottom: 13px;
}

header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(27px, 7vw, 49px);
  letter-spacing: .12em;
  line-height: 1.25;
  text-shadow: 0 0 28px rgba(194,104,205,.2);
}

.subtitle {
  margin-top: 20px;
  color: #bfb1c4;
  font-size: clamp(12px, 3.3vw, 16px);
  letter-spacing: .04em;
}

/* RELATIONSHIP BOARD */

.relationship-board {
  position: relative;
  width: 100%;
  aspect-ratio: 0.68;
  min-height: 540px;
  max-height: 1150px;
  border: 1px solid rgba(210,165,220,.34);
  border-radius: 34px;
  overflow: hidden;
  isolation: isolate;
  background: #09060e;
  box-shadow:
    0 20px 70px rgba(0,0,0,.45),
    0 0 40px rgba(143,64,158,.08);
}

/* 背景画像を枠いっぱいに表示 */

.board-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(
      to bottom,
      rgba(8,5,13,.25),
      rgba(8,5,13,.08) 45%,
      rgba(8,5,13,.3)
    ),
    url("images/relationship-bg.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

/* 背景の控えめな暗さ */

.board-background::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at center,
      transparent 24%,
      rgba(6,4,10,.22) 100%
    );
}

/* 線を描画するSVG */

.connection-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}

.connection {
  fill: none;
  stroke: #c6accd;
  stroke-width: 1.2;
  stroke-dasharray: 5 8;
  opacity: .23;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  transition:
    opacity .35s ease,
    stroke .35s ease,
    filter .35s ease;
}

.connection.hidden {
  opacity: 0;
}

.connection.active {
  stroke-dasharray: none;
  stroke-width: 2;
  opacity: 1;
  filter: drop-shadow(0 0 5px currentColor);
}

/* 線が伸びるアニメーション */

.connection.drawing {
  animation: drawLine .7s ease-out forwards;
}

@keyframes drawLine {
  from {
    stroke-dasharray: var(--line-length);
    stroke-dashoffset: var(--line-length);
  }
  to {
    stroke-dasharray: var(--line-length);
    stroke-dashoffset: 0;
  }
}

/* キャラクターカード */

.character {
  --accent: #bd8aca;

  position: absolute;
  z-index: 3;
  width: 29.5%;
  padding: 8px 8px 15px;
  border-radius: 20px;
  border: 1.5px solid var(--accent);
  background: rgba(21,14,29,.94);
  box-shadow:
    0 7px 24px rgba(0,0,0,.55),
    inset 0 0 14px rgba(255,255,255,.025);
  color: white;
  cursor: pointer;
  text-align: center;
  transform: translate(-50%, -50%);
  transition:
    opacity .35s ease,
    border-color .35s ease,
    box-shadow .35s ease,
    transform .35s ease,
    filter .35s ease;
  -webkit-tap-highlight-color: transparent;
}

.character:active {
  transform: translate(-50%, -50%) scale(.97);
}

.character:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.character img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: #130d19;
}

.character-name {
  display: block;
  margin-top: 11px;
  font-size: clamp(14px, 3.8vw, 22px);
  font-weight: 800;
  letter-spacing: .04em;
}

.character-role {
  display: block;
  margin-top: 7px;
  font-size: clamp(10px, 2.6vw, 14px);
  color: #bfb2c4;
  white-space: nowrap;
}

/* 配置 */

#mamon {
  left: 17.5%;
  top: 19%;
  --accent: #cda65e;
}

#leon {
  left: 50%;
  top: 19%;
  --accent: #a578e6;
}

#lambda {
  left: 82.5%;
  top: 19%;
  --accent: #64cbe6;
}

#karind {
  left: 17.5%;
  top: 81%;
  --accent: #df6687;
}

#noa {
  left: 50%;
  top: 81%;
  --accent: #ef7bb8;
}

#zinnia {
  left: 82.5%;
  top: 81%;
  --accent: #e99fbd;
}

/* 選択状態 */

.character.dimmed {
  opacity: .34;
  filter: grayscale(.4);
}

.character.selected {
  opacity: 1;
  z-index: 5;
  border-width: 2px;
  box-shadow:
    0 0 13px var(--accent),
    0 0 30px color-mix(
      in srgb,
      var(--accent) 30%,
      transparent
    ),
    0 8px 25px rgba(0,0,0,.6);
}

.character.connected {
  opacity: 1;
  filter: none;
  animation: connectedFlash .85s ease-out forwards;
}

@keyframes connectedFlash {
  0% {
    box-shadow:
      0 0 0 transparent;
  }

  30% {
    box-shadow:
      0 0 20px var(--accent),
      0 0 40px var(--accent),
      inset 0 0 14px rgba(255,255,255,.12);
  }

  100% {
    box-shadow:
      0 0 10px color-mix(
        in srgb,
        var(--accent) 55%,
        transparent
      ),
      0 0 22px color-mix(
        in srgb,
        var(--accent) 18%,
        transparent
      );
  }
}

/* 案内文 */

.board-hint {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  z-index: 4;
  text-align: center;
  font-size: clamp(8px, 2vw, 11px);
  letter-spacing: .1em;
  color: rgba(255,255,255,.6);
  pointer-events: none;
}

/* DOSSIER */

.dossier {
  margin-top: 40px;
  padding: 30px 24px;
  border: 1px solid var(--border);
  border-radius: 32px;
  background:
    linear-gradient(
      145deg,
      rgba(39,23,45,.95),
      rgba(13,10,19,.98)
    );
  box-shadow: 0 18px 45px rgba(0,0,0,.25);
}

.dossier-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.dossier-label {
  font-size: 12px;
  letter-spacing: .19em;
  line-height: 1.7;
  color: #b5a2bd;
}

.confidential {
  border: 1px solid #80688a;
  padding: 11px;
  font-size: 10px;
  color: #d0bcd5;
  white-space: nowrap;
}

.dossier h2 {
  margin: 22px 0 12px;
  font-size: clamp(25px, 6vw, 36px);
}

.dossier-description {
  color: #cbbfd0;
  font-size: 14px;
  line-height: 1.9;
}

.relationship-list {
  display: grid;
  gap: 12px;
  margin-top: 26px;
}

.relationship-item {
  padding: 17px;
  border-radius: 15px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(220,190,225,.14);
}

.relationship-item strong {
  display: block;
  font-size: 15px;
  margin-bottom: 7px;
}

.relationship-item p {
  margin: 0;
  color: #c6b8cb;
  font-size: 13px;
  line-height: 1.85;
}

.relationship-status {
  display: inline-block;
  margin-bottom: 9px;
  font-size: 10px;
  letter-spacing: .12em;
  color: #d0a7d8;
}

.reset-button {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  background: transparent;
  border: 1px solid rgba(220,190,225,.35);
  border-radius: 12px;
  color: #e9dceb;
  cursor: pointer;
  letter-spacing: .08em;
}

.reset-button:hover {

}

footer {
  text-align: center;
  padding-top: 40px;
  color: #74677b;

  font-size: 11px;

/* スマホ */

@media(max-width: 480px) {

    padding-left: 12px;

  .relationship-board {

  }

  .character {
    padding: 6px 6px 13px;
    border-radius: 17px;

  .character img {
    border-radius: 10px;
  }

  .character-name {
    margin-top: 9px;
  }

  .dossier {
    padding: 26px 20px;
  }
}

/* 動きを抑える設定 */

@media(prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<script>
"use strict";

/* =====================================
   BGM
   音楽情報は画面に表示しない
===================================== */

const bgmTracks = {
  upper: "audio/Shadow Protocol.mp3",
  lower: "audio/Shadow of the Last Dawn.mp3"
};

const characterBgm = {
  mamon: "upper",
  leon: "upper",
  lambda: "upper",

  karind: "lower",
  noa: "lower",
  zinnia: "lower"
};

const bgmPlayer = new Audio();

bgmPlayer.loop = true;
bgmPlayer.volume = 0.45;
bgmPlayer.preload = "none";

let currentBgm = null;

function playCharacterBgm(characterId) {

  const nextBgm = characterBgm[characterId];

  if (!nextBgm) return;

  /* 同じ曲なら再生位置を維持 */

  if (currentBgm === nextBgm) {

    if (bgmPlayer.paused) {
      bgmPlayer.play().catch(() => {});
    }

    return;
  }

  /* 別の曲なら最初から */

  currentBgm = nextBgm;

  bgmPlayer.pause();
  bgmPlayer.src = bgmTracks[nextBgm];
  bgmPlayer.load();

  bgmPlayer.currentTime = 0;

  bgmPlayer.play().catch(error => {
    console.warn("Audio playback:", error);
  });
}

/* =====================================
   キャラクターデータ
===================================== */

const characters = {

  mamon: {
    name: "マモン",
    description:
      "希少な女性を「最後の聖女」と呼び、所有することを愛と考える宗教指導者。自らの信念を絶対視し、信者を率いて行動する。"
  },

  leon: {
    name: "レオン",
    description:
      "法と秩序を自らの意思で利用する警察官。国家権力を背景に、独自の価値観で行動する。"
  },

  lambda: {
    name: "ラムダ",
    description:
      "医療支援AIから長い学習を経て独自の倫理と人格を形成した存在。人類全体を治療対象とみなし、自ら導き出した理論に従って行動する。"
  },

  karind: {
    name: "カリンド",
    description:
      "刺激と予測不能な展開を求める人工生命体。自らの興味に従って行動し、周囲に混乱をもたらす。"
  },

  noa: {
    name: "博士",
    description:
      "人間の知性と研究に絶対的な自負を持つ研究者。膨大な知識を有し、他者を研究対象として見下す傲慢な人物。"
  },

  zinnia: {
    name: "ジニア",
    description:
      "一途な愛を絶対視する男。拒絶も逃亡も自分に都合よく解釈し、相手の意思よりも自身の愛情を優先する。"
  }

};

/* =====================================
   関係性データ

   ※構想段階の関係を含む
   ※必要に応じて文章を変更可能
===================================== */

const relationships = [

  {
    a: "lambda",
    b: "noa",
    status: "構想段階",
    text:
      "博士がラムダの学習データに意図的な介入を行った可能性がある。ただし、最終的な理念はラムダ自身が導き出したもの。"
  },

  {
    a: "lambda",
    b: "karind",
    status: "構想段階",
    text:
      "人工生命カリンドの誕生にラムダが関与した可能性。人口減少に備えた生命創造という目的が考えられている。"
  },

  {
    a: "noa",
    b: "karind",
    status: "構想段階",
    text:
      "カリンドの誕生に博士が関わった可能性がある。博士にとっては研究成果であり、同時に興味深い玩具だったのかもしれない。"
  },

  {
    a: "mamon",
    b: "zinnia",
    status: "事件の接点",
    text:
      "ジニアが始末した警備員が、実はマモンの潜入信者だった可能性。互いに知らないまま、それぞれの計画が交錯する。"
  },

  {
    a: "mamon",
    b: "leon",
    status: "事件の接点",
    text:
      "マモンの信者による施設潜入は、警備体制に異変を生じさせる。レオン側の警備記録に痕跡が残る可能性がある。"
  },

  {
    a: "leon",
    b: "noa",
    status: "事件の接点",
    text:
      "国家施設で起きた警備上の異変。博士の物語では、その影響が警備員の少なさとして現れる可能性がある。"
  }

];

/* =====================================
   基本変数
===================================== */

const board = document.getElementById(
  "relationshipBoard"
);

const svg = document.getElementById(
  "connectionLayer"
);

const dossierLabel = document.getElementById(
  "dossierLabel"
);

const dossierTitle = document.getElementById(
  "dossierTitle"
);

const dossierDescription = document.getElementById(
  "dossierDescription"
);

const relationshipList = document.getElementById(
  "relationshipList"
);

const characterIds = Object.keys(characters);

let selectedId = null;
let animationTimers = [];

/* =====================================
   SVG生成
===================================== */

const SVG_NS = "http://www.w3.org/2000/svg";

function createSvgLine() {
  return document.createElementNS(
    SVG_NS,
    "line"
  );
}

/* =====================================
   カードの中心座標
===================================== */

function getCardRect(id) {

  const card = document.getElementById(id);
  const boardRect = board.getBoundingClientRect();
  const rect = card.getBoundingClientRect();

  return {
    left: rect.left - boardRect.left,
    right: rect.right - boardRect.left,
    top: rect.top - boardRect.top,
    bottom: rect.bottom - boardRect.top,
    width: rect.width,
    height: rect.height,
    cx:
      rect.left -
      boardRect.left +
      rect.width / 2,
    cy:
      rect.top -
      boardRect.top +
      rect.height / 2
  };
}

/* =====================================
   カードの枠と線の交点

   余白を作らずカード枠に接続
===================================== */

function getBoundaryPoint(rect, targetX, targetY) {

  const dx = targetX - rect.cx;
  const dy = targetY - rect.cy;

  if (dx === 0 && dy === 0) {
    return {
      x: rect.cx,
      y: rect.cy
    };
  }

  const halfW = rect.width / 2;
  const halfH = rect.height / 2;

  const tx =
    dx === 0
      ? Infinity
      : halfW / Math.abs(dx);

  const ty =
    dy === 0
      ? Infinity
      : halfH / Math.abs(dy);

  const t = Math.min(tx, ty);

  return {
    x: rect.cx + dx * t,
    y: rect.cy + dy * t
  };
}

/* =====================================
   線の座標を計算
===================================== */

function getLineCoordinates(a, b) {

  const rectA = getCardRect(a);
  const rectB = getCardRect(b);

  const start = getBoundaryPoint(
    rectA,
    rectB.cx,
    rectB.cy
  );

  const end = getBoundaryPoint(
    rectB,
    rectA.cx,
    rectA.cy
  );

  return {
    x1: start.x,
    y1: start.y,
    x2: end.x,
    y2: end.y
  };
}

/* =====================================
   線の色
===================================== */

function getCharacterColor(id) {

  const card = document.getElementById(id);

  return getComputedStyle(card)
    .getPropertyValue("--accent")
    .trim();
}

/* =====================================
   関係線の描画
===================================== */

function drawConnections() {

  svg.innerHTML = "";

  const boardRect = board.getBoundingClientRect();

  svg.setAttribute(
    "viewBox",
    `0 0 ${boardRect.width} ${boardRect.height}`
  );

  relationships.forEach((relationship, index) => {

    const coords = getLineCoordinates(
      relationship.a,
      relationship.b
    );

    const line = createSvgLine();

    line.setAttribute("x1", coords.x1);
    line.setAttribute("y1", coords.y1);
    line.setAttribute("x2", coords.x2);
    line.setAttribute("y2", coords.y2);

    line.classList.add("connection");

    line.dataset.a = relationship.a;
    line.dataset.b = relationship.b;
    line.dataset.index = index;

    svg.appendChild(line);
  });

  updateConnectionAppearance(false);
}

/* =====================================
   線の表示更新
===================================== */

function updateConnectionAppearance(animate = true) {

  const lines = svg.querySelectorAll(
    ".connection"
  );

  lines.forEach(line => {

    line.classList.remove(
      "active",
      "hidden",
      "drawing"
    );

    line.style.stroke = "";
    line.style.color = "";
    line.style.strokeDasharray = "";
    line.style.strokeDashoffset = "";
    line.style.removeProperty("--line-length");

    if (!selectedId) {
      return;
    }

    const a = line.dataset.a;
    const b = line.dataset.b;

    const isConnected =
      a === selectedId ||
      b === selectedId;

    if (!isConnected) {
      line.classList.add("hidden");
      return;
    }

    const color = getCharacterColor(
      selectedId
    );

    line.classList.add("active");

    line.style.stroke = color;
    line.style.color = color;

    if (animate) {

      const x1 = Number(line.getAttribute("x1"));
      const y1 = Number(line.getAttribute("y1"));
      const x2 = Number(line.getAttribute("x2"));
      const y2 = Number(line.getAttribute("y2"));

      const length = Math.hypot(
        x2 - x1,
        y2 - y1
      );

      line.style.setProperty(
        "--line-length",
        length
      );

      /* 選択したカードから線を伸ばす */

      if (b === selectedId) {

        line.setAttribute("x1", x2);
        line.setAttribute("y1", y2);
        line.setAttribute("x2", x1);
        line.setAttribute("y2", y1);
      }

      line.classList.add("drawing");

      const timer = setTimeout(() => {
        line.classList.remove("drawing");
        line.style.strokeDasharray = "none";
        line.style.strokeDashoffset = "0";
      }, 720);

      animationTimers.push(timer);
    }
  });
}

/* =====================================
   カードの発光
===================================== */

function updateCards() {

  characterIds.forEach(id => {

    const card = document.getElementById(id);

    card.classList.remove(
      "selected",
      "connected",
      "dimmed"
    );

    if (!selectedId) return;

    if (id === selectedId) {
      card.classList.add("selected");
      return;
    }

    const connected = relationships.some(r => {
      return (
        (r.a === selectedId && r.b === id) ||
        (r.b === selectedId && r.a === id)
      );
    });

    if (connected) {
      card.classList.add("connected");
    } else {
      card.classList.add("dimmed");
    }
  });
}

/* =====================================
   人物説明表示
===================================== */

function updateDossier() {

  relationshipList.innerHTML = "";

  if (!selectedId) {

    dossierLabel.textContent =
      "PERSONNEL DOSSIER / ALL";

    dossierTitle.textContent =
      "人物相関図";

    dossierDescription.textContent =
      "6人の悪役が、それぞれ異なる思想と目的を持って行動する。人物を選択すると、関連する人物との繋がりが表示される。";

    return;
  }

  const character = characters[selectedId];

  dossierLabel.textContent =
    "PERSONNEL DOSSIER / " +
    selectedId.toUpperCase();

  dossierTitle.textContent =
    character.name;

  dossierDescription.textContent =
    character.description;

  const related = relationships.filter(r => {
    return (
      r.a === selectedId ||
      r.b === selectedId
    );
  });

  if (related.length === 0) {

    const item = document.createElement("div");

    item.className = "relationship-item";

    item.textContent =
      "現在公開されている関係情報はありません。";

    relationshipList.appendChild(item);

    return;
  }

  related.forEach(r => {

    const otherId =
      r.a === selectedId
        ? r.b
        : r.a;

    const item = document.createElement("div");

    item.className = "relationship-item";

    const status = document.createElement("span");
    status.className = "relationship-status";
    status.textContent = r.status;

    const title = document.createElement("strong");
    title.textContent = characters[otherId].name;

    const description = document.createElement("p");
    description.textContent = r.text;

    item.appendChild(status);
    item.appendChild(title);
    item.appendChild(description);

    relationshipList.appendChild(item);
  });
}

/* =====================================
   アニメーションの後処理
===================================== */

function clearAnimationTimers() {

  animationTimers.forEach(timer => {
    clearTimeout(timer);
  });

  animationTimers = [];
}

/* =====================================
   キャラクター選択
===================================== */

function selectCharacter(id) {

  if (!characters[id]) return;

  /* BGM切り替え */
  playCharacterBgm(id);

  /* 同じキャラを再タップすると全体表示 */
  if (selectedId === id) {
    resetAll();
    return;
  }

  clearAnimationTimers();

  selectedId = id;

  /* SVGの座標を更新 */
  drawConnections();

  /* 発光・線・説明を更新 */
  updateCards();
  updateDossier();
  updateConnectionAppearance(true);
}

/* =====================================
   全体表示
   BGMは止めない
===================================== */

function resetAll() {

  clearAnimationTimers();

  selectedId = null;

  drawConnections();
  updateCards();
  updateDossier();
}

/* =====================================
   画面サイズ変更
===================================== */

let resizeTimer = null;

window.addEventListener("resize", () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    clearAnimationTimers();

    drawConnections();

  }, 120);
});

/* =====================================
   初期化
===================================== */

window.addEventListener("load", () => {

  drawConnections();
  updateCards();
  updateDossier();

});

/* =====================================
   ページ離脱時
===================================== */

window.addEventListener("pagehide", () => {
  bgmPlayer.pause();
});

</script>
