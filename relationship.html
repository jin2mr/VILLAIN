
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070d">
<title>PROJECT VILLAIN | 人物相関図</title>

<style>
:root {
  --bg: #08070d;
  --panel: #17111d;
  --text: #f7f0f8;
  --muted: #b7a9be;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 20%, #29182e, transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
}

button { font: inherit; }

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.container {
  max-width: 980px;
  margin: auto;
  padding: 26px 10px 65px;
}

.eyebrow {
  text-align: center;
  color: #bca0c5;
  font-size: 10px;
  letter-spacing: .25em;
}

h1 {
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(25px, 5vw, 43px);
  letter-spacing: .12em;
  margin: 8px 0;
}

.subtitle {
  text-align: center;
  color: #c7b9cc;
  font-size: 12px;
  margin-bottom: 27px;
}

/* 相関図全体 */

.board {
  position: relative;
  isolation: isolate;
  width: 100%;
  aspect-ratio: 1 / 1.03;
  border: 1px solid #58435f;
  border-radius: 22px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at center, #271a2d, #09070d 75%);
  box-shadow: 0 18px 55px #0009;
}

.board::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

/* 中央の鎖と蝶の背景 */

.center-art {
  position: absolute;
  left: 19%;
  top: 28%;
  width: 62%;
  height: 44%;
  background:
    url("images/relationship-bg.png")
    center / contain no-repeat;
  opacity: .70;
  filter: brightness(.76) contrast(1.15);
  mask-image:
    radial-gradient(ellipse, black 43%, transparent 76%);
  pointer-events: none;
}

.center-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-family: Georgia, serif;
  font-size: clamp(8px, 1.4vw, 13px);
  letter-spacing: .25em;
  color: #e4cde0a8;
  text-shadow: 0 2px 10px black;
  white-space: nowrap;
  pointer-events: none;
}

/* 関係線 */

.lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.link-line {
  stroke: #b7a0c0;
  stroke-width: .32;
  stroke-dasharray: 1.1 1.5;
  opacity: .25;
  transition: opacity .3s, stroke-width .3s;
}

.link-line.active {
  stroke: var(--line-color, #e7b8ff);
  stroke-width: .75;
  stroke-dasharray: none;
  opacity: 1;
  filter: drop-shadow(0 0 1px var(--line-color));
}

/* キャラクターカード */

.character {
  position: absolute;
  z-index: 2;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  width: 27%;
  max-width: 205px;
  padding: 8px 8px 11px;
  border: 1px solid var(--color);
  border-radius: 15px;
  background: linear-gradient(150deg, #231a29f5, #100d16fa);
  color: white;
  cursor: pointer;
  text-align: center;
  box-shadow: 0 5px 20px #0009;
  transition:
    transform .3s,
    box-shadow .3s,
    opacity .3s,
    filter .3s;
}

.character:hover,
.character.selected {
  transform: translate(-50%, -50%) scale(1.045);
  box-shadow:
    0 0 0 1px var(--color),
    0 0 25px var(--color),
    0 10px 25px #000b;
}

.character.dimmed {
  opacity: .32;
  filter: grayscale(.55);
}

.portrait {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  object-position: center;
  border: 1px solid var(--color);
  border-radius: 9px;
  background: #08070c;
}

.character-name {
  margin-top: 6px;
  font-weight: 800;
  font-size: clamp(13px, 2.5vw, 20px);
}

.character-role {
  margin-top: 2px;
  color: #c6b9cd;
  font-size: clamp(9px, 1.6vw, 12px);
}

.board-footer {
  position: absolute;
  bottom: 8px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 9px;
  letter-spacing: .12em;
  color: #bba6c2;
}

/* 関係説明パネル */

.details {
  margin-top: 20px;
  padding: 24px;
  border: 1px solid #55405c;
  border-radius: 20px;
  background: linear-gradient(145deg, #201627, #110d17);
  box-shadow: 0 12px 35px #0008;
}

.details-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.file-number {
  color: #bba2c5;
  font-size: 10px;
  letter-spacing: .15em;
}

.details h2 {
  margin: 7px 0;
  font-size: 27px;
}

.details-summary {
  color: #d0c2d5;
  font-size: 13px;
  line-height: 1.8;
}

.stamp {
  padding: 5px 8px;
  border: 1px solid #82648a;
  color: #e1c2e8;
  font-size: 9px;
  white-space: nowrap;
}

.separator {
  height: 1px;
  margin: 20px 0;
  background: linear-gradient(90deg, #80618b, transparent);
}

.relation-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.relation-card {
  padding: 14px;
  border: 1px solid #57445f;
  border-radius: 12px;
  background: #291d30;
}

.relation-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.relation-name {
  font-size: 15px;
  font-weight: bold;
}

.relation-status {
  border: 1px solid #82648a;
  border-radius: 20px;
  padding: 3px 7px;
  color: #e8caed;
  font-size: 10px;
  white-space: nowrap;
}

.relation-card p {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.85;
  color: #d5c7db;
}

.placeholder {
  color: #c9b9d0;
  font-size: 13px;
}

.reset-area {
  text-align: center;
  margin-top: 18px;
}

.reset-button {
  padding: 10px 24px;
  border: 1px solid #785b82;
  border-radius: 30px;
  background: #271c2d;
  color: white;
  cursor: pointer;
}

.reset-button:hover {
  background: #41304b;
}

.note {
  margin-top: 18px;
  text-align: center;
  color: #a99aaf;
  font-size: 11px;
  line-height: 1.8;
}

/* スマホ */

@media (max-width: 600px) {
  .container {
    padding: 23px 9px 50px;
  }

  .board {
    aspect-ratio: .75;
  }

  .character {
    width: 29%;
    padding: 5px 5px 8px;
    border-radius: 11px;
  }

  .portrait {
    border-radius: 7px;
  }

  .character-name {
    margin-top: 4px;
  }

  .character-role {
    font-size: 9px;
  }

  .center-art {
    left: 8%;
    width: 84%;
    top: 29%;
    height: 42%;
  }

  .center-label {
    font-size: 8px;
    letter-spacing: .12em;
  }

  .details {
    padding: 18px 13px;
  }

  .relation-list {
    grid-template-columns: 1fr;
  }

  .stamp {
    font-size: 8px;
  }

  .board-footer {
    font-size: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="eyebrow">
    CLASSIFIED ARCHIVE / 001
  </div>

  <h1>PROJECT VILLAIN</h1>

  <p class="subtitle">
    人物相関図 ─ 六人の悪役、交錯する思惑。
  </p>

  <section class="board" id="board">

    <div class="center-art"></div>

    <svg
      class="lines"
      id="lines"
      viewBox="0 0 100 100"
      preserveAspectRatio="none"
      aria-hidden="true">
    </svg>

    <div class="center-label">
      THE WEB OF VILLAINS
    </div>

    <!-- マモン -->
    <button
      class="character"
      data-id="mamon"
      style="--x:17%;--y:19%;--color:#d4aa66"
      aria-pressed="false">
      <img class="portrait"
           src="images/mamon.png"
           alt="マモン">
      <div class="character-name">マモン</div>
      <div class="character-role">宗教・所有</div>
    </button>

    <!-- レオン -->
    <button
      class="character"
      data-id="leon"
      style="--x:50%;--y:19%;--color:#a985e9"
      aria-pressed="false">
      <img class="portrait"
           src="images/leon.png"
           alt="レオン">
      <div class="character-name">レオン</div>
      <div class="character-role">国家・秩序</div>
    </button>

    <!-- ラムダ -->
    <button
      class="character"
      data-id="lambda"
      style="--x:83%;--y:19%;--color:#78cce9"
      aria-pressed="false">
      <img class="portrait"
           src="images/lambda.png"
           alt="ラムダ">
      <div class="character-name">ラムダ</div>
      <div class="character-role">人工神・医療AI</div>
    </button>

    <!-- カリンド -->
    <button
      class="character"
      data-id="karind"
      style="--x:17%;--y:81%;--color:#e47988"
      aria-pressed="false">
      <img class="portrait"
           src="images/karind.png"
           alt="カリンド">
      <div class="character-name">カリンド</div>
      <div class="character-role">人工生命・混沌</div>
    </button>

    <!-- 博士 -->
    <button
      class="character"
      data-id="noa"
      style="--x:50%;--y:81%;--color:#e87ab9"
      aria-pressed="false">
      <img class="portrait"
           src="images/noa.png"
           alt="博士">
      <div class="character-name">博士</div>
      <div class="character-role">研究・創造</div>
    </button>

    <!-- ジニア -->
    <button
      class="character"
      data-id="zinnia"
      style="--x:83%;--y:81%;--color:#e6a1bd"
      aria-pressed="false">
      <img class="portrait"
           src="images/zinnia.png"
           alt="ジニア">
      <div class="character-name">ジニア</div>
      <div class="character-role">執着・一途</div>
    </button>

    <div class="board-footer">
      TAP A CHARACTER TO REVEAL CONNECTIONS
    </div>

  </section>

  <!-- 関係説明 -->

  <section class="details" id="details">

    <div class="details-header">

      <div>
        <div class="file-number" id="file-number">
          PERSONNEL DOSSIER / ALL
        </div>

        <h2 id="details-title">
          人物相関図
        </h2>

        <div class="details-summary" id="details-summary">
          人物をタップすると、関連する人物との線が光り、
          関係の説明が表示されます。
        </div>
      </div>

      <span class="stamp">
        CONFIDENTIAL
      </span>

    </div>

    <div class="separator"></div>

    <div class="relation-list" id="relation-list">
      <p class="placeholder">
        気になるヴィランを選択してください。
      </p>
    </div>

  </section>

  <div class="reset-area">
    <button class="reset-button" id="reset">
      全体表示に戻す
    </button>
  </div>

  <p class="note">
    ※人物間の関係には構想段階の設定が含まれます。
    各クリエイターとの調整に応じて更新予定です。
  </p>

</main>

<script>
"use strict";

/*
  キャラクター設定
  ここを書き換えると説明文を変更できます。
*/

const characters = {
  mamon: {
    name: "マモン",
    summary:
      "希少な女性を「最後の聖女」とみなし、所有を愛と捉える宗教指導者。"
  },

  leon: {
    name: "レオン",
    summary:
      "国家・警察の権限と秩序を、自らの意志で利用する悪役。"
  },

  lambda: {
    name: "ラムダ",
    summary:
      "医療支援AIとして生まれ、人類そのものを「患者」と捉えるに至った人工神。"
  },

  karind: {
    name: "カリンド",
    summary:
      "予測不能な出来事に心を躍らせる人工生命体。人間形態の名はレイブン。"
  },

  noa: {
    name: "博士",
    summary:
      "AIにも引けを取らぬ知性と膨大な知識を誇る、傲慢な研究者。"
  },

  zinnia: {
    name: "ジニア",
    summary:
      "愛する相手の意思さえ自分に都合よく解釈する、独善的な執着者。"
  }
};

/*
  人物同士の関係設定

  a と b が関係する人物です。
  status は現在の設定状態です。
  text はタップ時に表示する説明です。
*/

const relationships = [

  {
    a: "mamon",
    b: "zinnia",
    status: "構想段階",
    text:
      "マモンの信者が警備員として潜入した施設で、ジニアが暗殺任務を遂行。殺害された警備員が実は信者だった、というすれ違いを検討中。"
  },

  {
    a: "mamon",
    b: "noa",
    status: "構想段階",
    text:
      "マモン側の警備員入れ替え工作が、博士編で描かれる施設の警備の薄さに繋がる可能性。博士とマモンが直接協力する関係ではない。"
  },

  {
    a: "mamon",
    b: "leon",
    status: "構想段階",
    text:
      "国家施設への潜入工作と、国家・警察側の警備体制が間接的に交差する接点。直接対決は未設定。"
  },

  {
    a: "leon",
    b: "zinnia",
    status: "構想段階",
    text:
      "ジニアの警備員殺害事件と、レオンが属する治安・警察組織。事件記録などを通じた接点を検討できる。"
  },

  {
    a: "leon",
    b: "lambda",
    status: "構想段階",
    text:
      "人間の権限で秩序を扱うレオンと、人類全体を治療対象とするラムダ。統治と判断の価値観が対照的。"
  },

  {
    a: "lambda",
    b: "noa",
    status: "構想段階",
    text:
      "博士がラムダに特定の歴史・破滅事例を学習させた可能性。ただし、ラムダの結論はあくまで本人が導き出したもの。"
  },

  {
    a: "lambda",
    b: "karind",
    status: "構想段階",
    text:
      "人工生命カリンドの誕生にラムダが関わった案。人口減少のリスク管理という目的と、予測不能な存在となった結果が対比される。"
  },

  {
    a: "noa",
    b: "karind",
    status: "構想段階",
    text:
      "カリンドの創造に博士が関与した案。博士にとっては玩具や遊びのような実験でも、カリンド自身は自由に動く。"
  },

  {
    a: "noa",
    b: "zinnia",
    status: "構想段階",
    text:
      "同じ施設に関係する別々の事件。ジニアの殺害行為が、博士編の警備状況に間接的な影響を与える可能性。"
  }

];

/* 以下は相関図の動作プログラム */

const board = document.getElementById("board");
const svg = document.getElementById("lines");
const nodes = [...document.querySelectorAll(".character")];

let selected = null;

const SVG_NS = "http://www.w3.org/2000/svg";

function getNode(id) {
  return document.querySelector(
    '.character[data-id="' + id + '"]'
  );
}

function drawLines() {
  svg.replaceChildren();

  const boardRect = board.getBoundingClientRect();

  if (!boardRect.width || !boardRect.height) {
    return;
  }

  relationships.forEach((relation, index) => {

    const a = getNode(relation.a);
    const b = getNode(relation.b);

    if (!a || !b) return;

    const rectA = a.getBoundingClientRect();
    const rectB = b.getBoundingClientRect();

    const x1 =
      (rectA.left + rectA.width / 2 - boardRect.left)
      / boardRect.width * 100;

    const y1 =
      (rectA.top + rectA.height / 2 - boardRect.top)
      / boardRect.height * 100;

    const x2 =
      (rectB.left + rectB.width / 2 - boardRect.left)
      / boardRect.width * 100;

    const y2 =
      (rectB.top + rectB.height / 2 - boardRect.top)
      / boardRect.height * 100;

    const line = document.createElementNS(
      SVG_NS, "line"
    );

    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);

    line.setAttribute("class", "link-line");
    line.dataset.index = index;

    svg.appendChild(line);
  });

  updateSelection();
}

function updateSelection() {

  const related = new Set();

  if (selected) {
    related.add(selected);
  }

  relationships.forEach(relation => {
    if (
      selected &&
      (relation.a === selected || relation.b === selected)
    ) {
      related.add(relation.a);
      related.add(relation.b);
    }
  });

  nodes.forEach(node => {

    const id = node.dataset.id;

    node.classList.toggle(
      "selected",
      id === selected
    );

    node.classList.toggle(
      "dimmed",
      selected !== null && !related.has(id)
    );

    node.setAttribute(
      "aria-pressed",
      String(id === selected)
    );
  });

  const color = selected
    ? getComputedStyle(getNode(selected))
        .getPropertyValue("--color").trim()
    : "#e7b8ff";

  svg.querySelectorAll(".link-line").forEach(line => {

    const relation =
      relationships[Number(line.dataset.index)];

    const active =
      selected !== null &&
      (relation.a === selected || relation.b === selected);

    line.classList.toggle("active", active);

    line.style.setProperty("--line-color", color);
  });
}

function showDetails() {

  const fileNumber =
    document.getElementById("file-number");

  const title =
    document.getElementById("details-title");

  const summary =
    document.getElementById("details-summary");

  const list =
    document.getElementById("relation-list");

  list.replaceChildren();

  if (!selected) {

    fileNumber.textContent =
      "PERSONNEL DOSSIER / ALL";

    title.textContent = "人物相関図";

    summary.textContent =
      "人物をタップすると、関連する人物との線が光り、関係の説明が表示されます。";

    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent =
      "気になるヴィランを選択してください。";

    list.appendChild(p);
    return;
  }

  const character = characters[selected];

  fileNumber.textContent =
    "PERSONNEL DOSSIER / " + selected.toUpperCase();

  title.textContent = character.name;
  summary.textContent = character.summary;

  const matches = relationships.filter(relation =>
    relation.a === selected ||
    relation.b === selected
  );

  if (matches.length === 0) {
    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent = "現在、公開できる接点はありません。";
    list.appendChild(p);
  }

  matches.forEach(relation => {

    const otherId =
      relation.a === selected
        ? relation.b
        : relation.a;

    const other = characters[otherId];

    const card = document.createElement("article");
    card.className = "relation-card";

    const top = document.createElement("div");
    top.className = "relation-top";

    const name = document.createElement("span");
    name.className = "relation-name";
    name.textContent = "↔ " + other.name;

    const status = document.createElement("span");
    status.className = "relation-status";
    status.textContent = relation.status;

    const description = document.createElement("p");
    description.textContent = relation.text;

    top.append(name, status);
    card.append(top, description);

    list.appendChild(card);
  });
}

function selectCharacter(id) {

  selected = selected === id ? null : id;

  updateSelection();
  showDetails();

  if (
    selected &&
    window.matchMedia("(max-width: 600px)").matches
  ) {
    document.getElementById("details").scrollIntoView({
      behavior: window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches ? "instant" : "smooth",
      block: "nearest"
    });
  }
}

nodes.forEach(node => {
  node.addEventListener("click", () => {
    selectCharacter(node.dataset.id);
  });
});

document.getElementById("reset")
  .addEventListener("click", () => {

    selected = null;

    updateSelection();
    showDetails();

  });

window.addEventListener("resize", drawLines);
window.addEventListener("load", drawLines);

if ("ResizeObserver" in window) {
  new ResizeObserver(drawLines).observe(board);
}

drawLines();

</script>
</body>
</html>
